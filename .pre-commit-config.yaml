# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Universal hygiene hooks (formatting, syntax sanity)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Local project checks using system toolchains
  - repo: local
    hooks:
      - id: selene
        name: selene
        entry: selene
        language: system
        types: [lua]

      - id: tests
        name: tests
        entry: timeout 30s nvim --headless -u NONE -c "lua dofile('tests/test_filetype_loading.lua')"
        language: system
        pass_filenames: false
        always_run: true
